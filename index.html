<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Depósito</title>
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depósito">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;
       background:linear-gradient(135deg,#0b3d91,#1565c0);padding:24px}
  .in{max-width:360px;width:100%}
  img.ic{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  h1{margin:18px 0 6px;font-size:26px}
  p{margin:0 0 22px;opacity:.85;font-size:15px}
  a.abrir,button{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:14px;border-radius:12px;
       border:0;text-decoration:none;cursor:pointer;margin-top:12px}
  a.abrir{background:#ff9800;color:#1c1c1c}
  #instalar{display:none;background:transparent;color:#fff;border:2px solid #fff}
  #ios{display:none;font-size:13.5px;opacity:.9;margin-top:16px;line-height:1.5}
  #aviso{display:none;background:#fdecea;color:#b3261e;border-radius:10px;padding:12px;font-size:14px;margin-top:14px}
</style>
</head>
<body>
<div class="in">
  <img class="ic" src="icon-192.png" alt="Depósito">
  <h1>Depósito</h1>
  <p id="sub">Abriendo la aplicación…</p>
  <a class="abrir" id="abrir" href="#">Abrir aplicación</a>
  <button id="instalar" type="button">Instalar en tu celular</button>
  <div id="ios">En iPhone: tocá el botón Compartir y elegí "Agregar a inicio".</div>
  <div id="aviso">Falta configurar la dirección de la aplicación.</div>
</div>

<script>
  // Dirección de tu aplicación de Apps Script. Tiene que terminar en /exec (NO en /dev)
  var APP_URL = 'PEGAR_AQUI_LA_URL_QUE_TERMINA_EN_/exec';

  var configurada = APP_URL.indexOf('/exec') > 0 && APP_URL.indexOf('PEGAR') < 0;
  var instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var $ = function(id){ return document.getElementById(id); };

  if (!configurada) {
    $('aviso').style.display = 'block'; $('abrir').style.display = 'none'; $('sub').textContent = 'Instalá la app en tu celular';
  } else {
    $('abrir').href = APP_URL;
    // Si ya está instalada, abre directo la aplicación
    if (instalada) { $('sub').textContent = 'Abriendo la aplicación…'; setTimeout(function(){ location.replace(APP_URL); }, 400); }
    else { $('sub').textContent = 'Tocá "Abrir aplicación" o instalala en tu celular'; }
  }

  var ev = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); ev = e; if (!instalada) $('instalar').style.display = 'block'; });
  $('instalar').addEventListener('click', function(){
    if (!ev) return; ev.prompt();
    ev.userChoice.then(function(){ ev = null; $('instalar').style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){ $('instalar').style.display = 'none'; });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !instalada) $('ios').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
